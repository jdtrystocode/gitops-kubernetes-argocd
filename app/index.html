<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitOps Demo App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 520px;
    }
    h1 { color: #2563eb; }
    .version {
      display: inline-block;
      background: #dbeafe;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>GitOps Demo App</h1>
    <p>Deployed automatically using Kubernetes and Argo CD.</p>
    <p class="version">Version 2.0</p>
    <p>Deployment status: Application running</p>
  </main>
</body>
</html>
